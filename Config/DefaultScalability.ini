; Scalability profiles tuned for Craquez (Android Pilot -> PC/Console High-End)

[AntiAliasingQuality@0]
r.PostProcessAAQuality=0

[AntiAliasingQuality@1]
r.PostProcessAAQuality=2

[AntiAliasingQuality@3]
r.PostProcessAAQuality=6

[EffectsQuality@0]
; Android Low: lightweight Niagara grass/rain particles, jersey cloth LOD disabled on distant players
fx.Niagara.QualityLevel=0
p.ChaosCloth.EnableSim=0
r.SubsurfaceQuality=0

[EffectsQuality@1]
; Android Balanced (Target 60 FPS on mid-range Snapdragon/Dimensity)
fx.Niagara.QualityLevel=1
p.ChaosCloth.EnableSim=1
r.SubsurfaceQuality=1

[EffectsQuality@3]
; High-End Android / Desktop Epic: full Chaos Cloth jerseys, SSS skin, GPU crowd & rain
fx.Niagara.QualityLevel=3
p.ChaosCloth.EnableSim=1
r.SubsurfaceQuality=2

[ShadowQuality@0]
r.ShadowQuality=1
r.Shadow.MaxCSMResolution=512

[ShadowQuality@1]
r.ShadowQuality=2
r.Shadow.MaxCSMResolution=1024

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.MaxCSMResolution=2048
